services:
  server:
    build:
      context: ./server
      dockerfile: dockerfile
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://hotel:${DB_PASSWORD:-hotelpass}@db:5432/hotel_tracker
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      HOTEL_AGENT_TOKEN: ${HOTEL_AGENT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MENTION_USER_ID: ${DISCORD_MENTION_USER_ID:-}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotelpass}
      POSTGRES_DB: hotel_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hotel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  hotel_db_data:
